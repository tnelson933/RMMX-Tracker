# iOS is built and submitted in one run. Android intentionally stops after
# producing an .aab until a Google Play service-account key is available.
name: Release Rider App (iOS submit + Android bundle)

defaults:
  tools:
    node: "20.19.4"
    pnpm: "10.26.1"
  run:
    working_directory: ./artifacts/rider-app

jobs:
  build_ios:
    name: Build iOS for App Store
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit iOS to App Store Connect
    needs:
      - build_ios
    type: testflight
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
    hooks:
      after_checkout:
        - name: Expose Rider App config to EAS Submit
          run: |
            node -e 'require("fs").writeFileSync("app.json", JSON.stringify({expo:{name:"RM Tracker",slug:"rider-app",owner:"tnelson933",ios:{bundleIdentifier:"com.rockymountain.riderapp"},extra:{eas:{projectId:"97b8d6d6-ed00-43d6-8c64-128a8c2b6800"}}}}))'
            cp artifacts/rider-app/eas.json eas.json

  build_android:
    name: Build Android bundle for manual Play upload
    type: build
    params:
      platform: android
      profile: production