# RM Roost self-hosted stack: Postgres + API + Caddy (web + /api proxy).
# Usage (from repo root):
#   cp deploy/.env.example deploy/.env   # fill in values
#   docker compose -f deploy/docker-compose.yml up -d --build
# See deploy/README.md.
name: rmtracker

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: rmtracker
      POSTGRES_DB: rmtracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rmtracker -d rmtracker"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rmtracker:${POSTGRES_PASSWORD}@db:5432/rmtracker
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
  caddy_data:
